[project]
name = "health-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Backend
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyjwt>=2.8",
    # Agent
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.0",
    # Memory
    "mem0ai>=0.1",
    "graphiti-core>=0.3",
    "zep-cloud>=2.0",
    # Storage
    "redis>=5.0",
    "aiosqlite>=0.20",
    "sentence-transformers>=3.0",
    "langchain-neo4j>=0.9",
    "rank-bm25>=0.2",
    "httpx>=0.27",
    # PDF export
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "backend",
    "memory",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
